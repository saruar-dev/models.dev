# OpenRouter lists drex-max with text input only (https://openrouter.ai/api/v1/models?output_modalities=text,decisions,
# accessed 2026-10-26), so the lab's image input is narrowed to text here.
schema = 2
base_model = "nace-ai/drex-max"

[modalities]
input = ["text"]
output = ["decision"]

[capabilities]
structured_output = false

[api.systemone]
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/openrouter" }

[cost.text.input]
price = 0.06

[cost.text.output]
price = 0
